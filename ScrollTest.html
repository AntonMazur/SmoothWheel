<small>SMOOTHWHEEL / HARDWARE CHECK</small><h1>Find your comfortable scroll.</h1><aside>Enable SmoothWheel from its menu-bar icon. Scroll here, then hold Option and scroll again to compare the original wheel behavior.</aside><main id="content"></main>
<script>const titles=['Try a single wheel notch','Scroll several notches quickly','Reverse direction','Hold Option to compare','Try your trackpad','Adjust the settings'];const descriptions=['A small turn should produce a controlled, smooth movement.','The page should keep moving smoothly without a long runaway tail.','Change from down to up. The old direction should stop immediately.','While Option is held, the original wheel events pass through.','If you have a trackpad, its scrolling should behave as usual.','Try a slower speed for reading and less smoothing if the motion feels floaty.'];for(let i=0;i<24;i++){const a=document.createElement('article');a.innerHTML=`<small>CHECK ${String(i+1).padStart(2,'0')}</small><h2>${titles[i%6]}</h2><p>${descriptions[i%6]}</p>`;document.getElementById('content').append(a)}</script></html>
