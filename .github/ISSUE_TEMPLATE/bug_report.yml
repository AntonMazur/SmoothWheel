name: Scrolling problem
description: Report a mouse or application compatibility issue.
body:
  - type: input
    id: mouse
    attributes:
      label: Mouse and connection type
      placeholder: Razer model, USB receiver / Bluetooth / wired
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and affected application
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and how can we reproduce it?
      description: Include your preset and whether Option bypass restores the expected behavior.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other mouse utilities or drivers
